name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'docusaurus/**'
  # The landing-page stats band reads the download count from
  # plugins.jetbrains.com, active users from devoxx.com and the GitHub star
  # count from api.github.com at build time
  # (docusaurus/src/plugins/genie-stats), so a rebuild is what refreshes them.
  # Daily, 05:00 UTC.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docusaurus
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docusaurus/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          # genie-stats fetches the repo's star count; unauthenticated
          # api.github.com rate limits are per-IP and Actions runners share IPs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docusaurus/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
